[service]
public_origin = "https://feedback-api.example.com"
oauth_callback = "https://feedback.example.com/v1/oauth/callback.html"
data_directory = "/data"
github_app_id = 1
github_client_id = "replace-with-github-client-id"
github_concurrency = 2
http_connect_timeout_seconds = 3
http_request_timeout_seconds = 10

[sites.example]
origins = ["https://www.example.com"]
mode = "discussion"
mapping = "key"
repository = "example/site"
repository_id = "replace-with-repository-node-id"
installation_id = 1
default_category = "articles"
discussion_body = "Discussion for [{title}]({url})."

# Optional cache tuning; these are the defaults.
# cache_fresh_seconds = 60
# refresh_cooldown_seconds = 60
# refresh_sweep_seconds = 86400
# max_batch_size = 100
intents = ["votes", "reactions", "discussion", "comments", "answers", "polls", "authors", "moderation", "comment_reactions", "labels", "github_link"]
reaction_counters = ["LAUGH", "HOORAY", "CONFUSED", "HEART", "ROCKET", "EYES"]
# Optional: pre-register discussions whose stable numeric and node IDs are known
# so anonymous reads work immediately after starting with an empty database.
# known_discussions = [
#   { key = "articles/example", id = "D_example", number = 1, category = "articles", title = "articles/example" },
# ]

[sites.example.categories.articles]
name = "Articles"
id = "replace-with-articles-category-node-id"

[sites.example.categories.tips]
name = "Tips"
id = "replace-with-tips-category-node-id"

[sites.example.categories.updates]
name = "Updates"
id = "replace-with-updates-category-node-id"
