name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      # - run: npm ci
      #   working-directory: runtime
      # - run: npm run check
      #   working-directory: runtime
      # - run: npm run lint
      #   working-directory: runtime
      # - run: npm test
      #   working-directory: runtime
      - run: npm run build
        working-directory: runtime
      - name: Stage Pages metadata
        run: cp CNAME .nojekyll runtime/dist/pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: runtime/dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
