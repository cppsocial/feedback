<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://feedback-api.cpp.social https://api.github.com http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
    <link rel="stylesheet" href="/example/style.css">
    <title>Feedback integration example</title>
  </head>
  <body>
    <main>
      <h1>Feedback integration example</h1>
      <p>This page renders the feedback discussion, canonical reactions, labels, comments, minimized comments, and replies.</p>
      <p>API: <code id="api-origin"></code></p>
      <div id="authentication-status" class="authentication-status"></div>
      <section id="thread" class="thread"></section>
      <form id="comment-form" class="comment-form">
        <textarea id="comment-body" rows="4" maxlength="16000" placeholder="Add a comment"></textarea>
        <button type="submit">Sign in and comment</button>
        <button id="clear-reply" type="button" hidden>Cancel reply</button>
      </form>
      <p id="status" role="status">Loading…</p>
    </main>
    <script src="{{EXAMPLE_SCRIPT}}"></script>
  </body>
</html>
