# Include deploy/nginx-rate-zones.conf once in nginx's http context, then
# include this file inside the TLS-enabled feedback-api.cpp.social server.
# ngx_brotli must be available for the brotli directives.

client_max_body_size 16k;
client_body_timeout 5s;
keepalive_timeout 15s;
limit_req_status 429;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
proxy_hide_header Server;

brotli on;
brotli_comp_level 4;
brotli_min_length 1024;
brotli_types application/json application/problem+json text/plain;

gzip on;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/problem+json text/plain;

location ~ ^/v1/sites/[a-z0-9-]+/(?:oauth/(?:authorize|exchange)|discussions/ensure)$ {
    limit_req zone=feedback_sensitive burst=5 nodelay;
    proxy_pass http://127.0.0.1:18080;
}

location ~ ^/v1/sites/[a-z0-9-]+/(?:reactions|discussion)$ {
    limit_req zone=feedback_general burst=30 nodelay;
    proxy_pass http://127.0.0.1:18080;
}

location / {
    return 404;
}
