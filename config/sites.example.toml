[service]
public_origin = "https://feedback-api.example.com"
oauth_callback = "https://feedback.example.com/v1/oauth/callback.html"
data_directory = "/data/sites"
github_app_id = 1
github_client_id = "replace-with-github-client-id"
github_concurrency = 2
http_connect_timeout_seconds = 3
http_request_timeout_seconds = 10

[sites.example]
origins = ["https://www.example.com"]
mapping = "key"
repository = "example/site"
repository_id = "replace-with-repository-node-id"
installation_id = 1
category = "Resources"
category_id = "replace-with-category-node-id"

# Optional cache tuning; these are the defaults.
# cache_fresh_seconds = 5
# refresh_cooldown_seconds = 5
# refresh_sweep_seconds = 86400
# max_batch_size = 100
features = ["counters", "viewer_reactions", "voting", "discussion", "comments", "labels", "github_link"]
reaction_counters = ["LAUGH", "HOORAY", "CONFUSED", "HEART", "ROCKET", "EYES"]
upvote_source = "both" # thumbsup, native, or both
downvotes = true
