query FeedbackDiscussionReactions($ids: [ID!]!, $includeReactions: Boolean!) {
  nodes(ids: $ids) {
    ... on Discussion {
      id
      locked
      updatedAt
      upvoteCount
      reactionGroups @include(if: $includeReactions) {
        content
        reactors { totalCount }
      }
    }
  }
}
