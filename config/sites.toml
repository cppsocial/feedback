[service]
public_origin = "https://feedback-api.cpp.social"
oauth_callback = "https://feedback.cpp.social/v1/oauth/callback.html"
data_directory = "/data"
github_app_id = 4961716
github_client_id = "Iv23lij7PpR7LjpKa1um"
github_concurrency = 2
http_connect_timeout_seconds = 3
http_request_timeout_seconds = 10

[sites.feedback-cpp-social]
origins = ["https://feedback.cpp.social"]
mode = "discussion"
mapping = "key"
repository = "cppsocial/feedback"
repository_id = "R_kgDOUc9png"
installation_id = 162105624
default_category = "general"
discussion_body = "Feedback for [{title}]({url})"
intents = ["upvotes", "reactions", "discussion", "comments", "labels", "github_link"]
reaction_counters = ["LAUGH", "HOORAY", "CONFUSED", "HEART", "ROCKET", "EYES"]

[sites.feedback-cpp-social.categories.general]
name = "General"
id = "DIC_kwDOUc9pns4DFwQt"

[sites.cpp-social]
origins = ["https://cpp.social"]
mode = "ranking"
mapping = "key"
repository = "cppsocial/site"
repository_id = "R_kgDOSOfNQQ"
installation_id = 162105624
default_category = "resources"
intents = ["upvotes"]

[sites.cpp-social.categories.resources]
