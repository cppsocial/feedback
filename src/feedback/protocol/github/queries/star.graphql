mutation FeedbackStar($id: ID!, $remove: Boolean!, $add: Boolean!) {
  remove: removeReaction(input: {subjectId: $id, content: EYES})
    @include(if: $remove) { subject { ...FeedbackStarState } }
  add: addReaction(input: {subjectId: $id, content: EYES})
    @include(if: $add) { subject { ...FeedbackStarState } }
}

fragment FeedbackStarState on Reactable {
  reactionGroups {
    content
    viewerHasReacted
  }
}
